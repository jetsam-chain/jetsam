[workspace]
members = [
    "bench_prover",
    "jetsam_core",
    "jetsam_fri",
    "jetsam_fri_binius",
    "jetsam_poseidon2b",
    "jetsam_ivc_core",
    "jetsam_ivc_prover",
    "jetsam_tx",
    "jetsam_chain",
    "jetsam_gkr",
    "jetsam_block",
    "jetsam_recursive",
    "jetsam_soundness",
    # Node Infrastructure
    "jetsam_mempool",
    "jetsam_miner",
    "jetsam_p2p",
    "jetsam_rpc",
    "jetsam_node",
    "jetsam_gui",
    # External tools
    "jetsam_extminer",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# HistoryStep is dominated by two large cross-crate prover phases. Thin LTO
# plus one codegen unit removes cross-crate abstraction and codegen overhead.
# This changes executable code only; proof relations and frozen matrix bytes
# remain identical.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
