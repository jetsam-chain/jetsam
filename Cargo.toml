[workspace]
members = [
    "bench_prover",
    "jetsam_core",
    "jetsam_fri",
    "jetsam_fri_binius",
    "jetsam_poseidon2b",
    "jetsam_ivc_core",
    "jetsam_ivc_prover",
    "jetsam_tx",
    "jetsam_chain",
    "jetsam_gkr",
    "jetsam_block",
    "jetsam_recursive",
    "jetsam_soundness",
    # Node Infrastructure
    "jetsam_mempool",
    "jetsam_miner",
    "jetsam_p2p",
    "jetsam_rpc",
    "jetsam_node",
    "jetsam_gui",
    # External tools
    "jetsam_extminer",
    # v1.5 prototype: example client of the HistoryStep client slot
    "jetsam_client_agent",
    # Prototype: a computed batch of catalogue entry 1 (capacity 128 listed
    # by the test network's catalogue only, as a test entry)
    "jetsam_client_agent_batch",
    # v1.7 guardian software (T5.1-T5.6): observer, signer, aggregator, ceremony
    "jetsam_guardian",
    # v1.7 bridge vault: V4, the deposit rule the node and the proof program share
    "jetsam_vault_rule",
    # v1.7 bridge proof program (T4.9): the relations its SP1 guests prove;
    # the guests themselves build alone for the zkVM target
    "jetsam_bridge_program/core",
    "jetsam_bridge_program/towerwalk",
    # G6 = V4 in CI: the node's gate and the program on the same blocks
    "jetsam_bridge_program/xtest",
]
resolver = "2"

[workspace.package]
# The number a miner is asked for on a fork day, so it has to answer the only
# question actually being asked: does this binary know the fork? 1.3.1 was the
# last build that did not know v1.4. Every build carrying the TowerWalk proof
# of work — armed or dormant — is 1.4.x, so no two binaries that disagree about
# the consensus rules can ever report the same version.
# 1.5.0 is the first build that knows the v1.5 fork (client slot, 180 s blocks,
# 480-block development payouts). It ships dormant: the public profile carries
# no activation height, so before an armed height it behaves as 1.4.3 does.
# 1.5.1 keeps the v1.5 rules (armed at 38400) and pins blocks 38399 and 38400;
# its fix is to synchronization: a branch the node refuses can no longer
# capture its snapshot sync.
# 1.6.0 is the first release that knows the v1.6 fork (batch relation and
# consensus rule updates); below the v1.6 height of its profile it applies the
# 1.5.1 consensus rules.
# 1.6.1 keeps the 1.6.0 consensus rules and activation heights, and pins
# blocks 46079 and 46080 (the public network's v1.6 crossing): a node
# installed or re-synced from now on can only follow the real chain.
# 1.7.0 is the first build that knows the v1.7 fork (the bridge vault and
# its destination rules). It ships dormant on the public network, which
# carries no v1.7 height yet; the test chain arms it at 8160. Below its
# profile's v1.7 height it applies the 1.6.1 consensus rules, its pins included.
version = "1.7.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# HistoryStep is dominated by two large cross-crate prover phases. Thin LTO
# plus one codegen unit removes cross-crate abstraction and codegen overhead.
# This changes executable code only; proof relations and frozen matrix bytes
# remain identical.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

# The bridge proof program hashes with software GF(2^128) (it is written for the zkVM): unoptimized, one
# block of its cross tests takes a quarter of a second. Optimized in test builds too; no other crate is
# affected.
[profile.dev.package.jetsam_bridge_towerwalk]
opt-level = 3
[profile.dev.package.jetsam_bridge_program]
opt-level = 3

# The published libmdbx 0.6.6 does not compile for x86_64-pc-windows-gnu: it
# assumes every Windows build is MSVC, while bindgen picks a different integer
# type under mingw. The fix is two `#[cfg]` attributes, vendored in-tree so the
# Windows binaries can be rebuilt from a clone rather than from one machine.
# See third_party/libmdbx-0.6.6-mingw/PATCH.md. No effect on other targets.
[patch.crates-io]
libmdbx = { path = "third_party/libmdbx-0.6.6-mingw" }
