[workspace]
members = [
    "bench_prover",
    "elide_core",
    "elide_fri",
    "elide_fri_binius",
    "elide_poseidon2b",
    "elide_ivc_core",
    "elide_ivc_prover",
    "elide_tx",
    "elide_chain",
    "elide_gkr",
    "elide_block",
    "elide_recursive",
    "elide_soundness",
    # Node Infrastructure
    "elide_mempool",
    "elide_miner",
    "elide_p2p",
    "elide_rpc",
    "elide_node",
    "elide_gui",
    # External tools
    "elide_extminer",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# HistoryStep is dominated by two large cross-crate prover phases. Thin LTO
# plus one codegen unit removes cross-crate abstraction and codegen overhead.
# This changes executable code only; proof relations and frozen matrix bytes
# remain identical.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
