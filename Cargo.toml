[workspace]
members = [
    "bench_prover",
    "jetsam_core",
    "jetsam_fri",
    "jetsam_fri_binius",
    "jetsam_poseidon2b",
    "jetsam_ivc_core",
    "jetsam_ivc_prover",
    "jetsam_tx",
    "jetsam_chain",
    "jetsam_gkr",
    "jetsam_block",
    "jetsam_recursive",
    "jetsam_soundness",
    # Node Infrastructure
    "jetsam_mempool",
    "jetsam_miner",
    "jetsam_p2p",
    "jetsam_rpc",
    "jetsam_node",
    "jetsam_gui",
    # External tools
    "jetsam_extminer",
    # v1.5 prototype: example client of the HistoryStep client slot
    "jetsam_client_agent",
]
resolver = "2"

[workspace.package]
# The number a miner is asked for on a fork day, so it has to answer the only
# question actually being asked: does this binary know the fork? 1.3.1 was the
# last build that did not know v1.4. Every build carrying the TowerWalk proof
# of work — armed or dormant — is 1.4.x, so no two binaries that disagree about
# the consensus rules can ever report the same version.
# 1.5.0 is the first build that knows the v1.5 fork (client slot, 180 s blocks,
# 480-block development payouts). It ships dormant: the public profile carries
# no activation height, so before an armed height it behaves as 1.4.3 does.
version = "1.5.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"

# HistoryStep is dominated by two large cross-crate prover phases. Thin LTO
# plus one codegen unit removes cross-crate abstraction and codegen overhead.
# This changes executable code only; proof relations and frozen matrix bytes
# remain identical.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

# The published libmdbx 0.6.6 does not compile for x86_64-pc-windows-gnu: it
# assumes every Windows build is MSVC, while bindgen picks a different integer
# type under mingw. The fix is two `#[cfg]` attributes, vendored in-tree so the
# Windows binaries can be rebuilt from a clone rather than from one machine.
# See third_party/libmdbx-0.6.6-mingw/PATCH.md. No effect on other targets.
[patch.crates-io]
libmdbx = { path = "third_party/libmdbx-0.6.6-mingw" }
