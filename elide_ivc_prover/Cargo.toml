[package]
name = "elide-ivc-prover"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Paranoid recursive proof prover over GF(2)."

[features]
# Forwarded to elide-ivc-core.
hash-count = ["elide-ivc-core/hash-count"]
unsound-challenger = ["elide-ivc-core/unsound-challenger"]

[dependencies]
elide-ivc-core = { path = "../elide_ivc_core" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"

[dev-dependencies]
elide-ivc-core = { path = "../elide_ivc_core", features = ["unsound-challenger"] }
elide_core = { path = "../elide_core" }
elide_poseidon2b = { path = "../elide_poseidon2b" }
