[package]
name = "jetsam_chain"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[features]
# Test-chain identity: distinct genesis, address HRP, protocol namespace,
# ports and data directory. Never enable for a mainnet release.
testnet = ["jetsam_poseidon2b/testnet"]
# PRIVATE BUILDS ONLY: the test profile with
# v1.5 armed at 36 and v1.6 at 64, the short client activation delay from
# genesis, so a private chain on a loopback-only network crosses both in a
# few hours. Never in a release build, never on a public network: no
# released binary, script or pack is built with it.
rehearsal-v1-6 = ["testnet"]

[dependencies]
tracing = { workspace = true }
jetsam_core = { path = "../jetsam_core" }
jetsam_poseidon2b = { path = "../jetsam_poseidon2b" }
jetsam_tx = { path = "../jetsam_tx" }
jetsam_fri = { path = "../jetsam_fri" }
jetsam_fri_binius = { path = "../jetsam_fri_binius" }
rayon = "1.10"
libmdbx = "0.6"
bincode = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
rayon     = "1.10"
