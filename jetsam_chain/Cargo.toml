[package]
name = "jetsam_chain"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[features]
# Isolated live fork tests only. NEVER enable for a public-network release:
# it arms every v1.2 rule at height 5 on a chain whose genesis is the mainnet
# genesis, so a build carrying it must never reach a public interface.
isolated-v1-2-testnet = []

# Test-chain identity: distinct genesis, address HRP, protocol namespace,
# ports and data directory. Never enable for a mainnet release.
testnet = ["jetsam_poseidon2b/testnet"]

[dependencies]
tracing = { workspace = true }
jetsam_core = { path = "../jetsam_core" }
jetsam_poseidon2b = { path = "../jetsam_poseidon2b" }
jetsam_tx = { path = "../jetsam_tx" }
jetsam_fri = { path = "../jetsam_fri" }
jetsam_fri_binius = { path = "../jetsam_fri_binius" }
rayon = "1.10"
libmdbx = "0.6"
bincode = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
rayon     = "1.10"
