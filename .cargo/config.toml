# Every build keeps a portable process-wide baseline so the executable can
# inspect CPU capabilities before proof code runs. Production then requires
# SSE4.1 + PCLMULQDQ on x86-64 or NEON + PMULL on AArch64 and selects wider
# AVX2+VPCLMULQDQ/AVX-512 kernels at runtime. The scalar path remains available
# only to differential tests.

# Build paths never travel with the binary.
#
# A cross-built Windows executable carried 1770 copies of `/root/.cargo` —
# no secret, but the layout of the machine that produced it, published to
# everyone who downloads a wallet. The Linux build happened to be clean only
# because it runs in a container whose CARGO_HOME is already `/cargo`; that is
# luck, not policy. Remapping here makes it a property of the repository, so it
# holds for every target and every machine, including whichever one builds the
# next release.
[build]
rustflags = [
    "--remap-path-prefix=/root/.cargo=/cargo",
    "--remap-path-prefix=/opt/elide/src=/jetsam",
    "--remap-path-prefix=/opt/jetsam-build-src=/jetsam",
    # The Windows node is cross-built against a patched libmdbx copied out of
    # the crate registry, and that copy's path was travelling in the binary
    # alongside the cargo one. Remapping only /root/.cargo left it behind.
    "--remap-path-prefix=/opt/libmdbx-0.6.6-mingw=/libmdbx",
]
