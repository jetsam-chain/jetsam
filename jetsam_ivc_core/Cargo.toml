[package]
name = "jetsam-ivc-core"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Jetsam recursive proof core over GF(2)."

[features]
# Count hash invocations via global relaxed atomics. Off by default.
hash-count = []
# Compile the insecure `RandomChallenger` into a non-test build. Never enable
# it for builds that produce real proofs.
unsound-challenger = []

[dependencies]
rayon = "1"
jetsam_core = { path = "../jetsam_core" }
jetsam_poseidon2b = { path = "../jetsam_poseidon2b" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
toml = "0.8"

[dev-dependencies]
# Used by `LigeritoSecurityConfig` serde round-trip tests.
serde_json = "1"
