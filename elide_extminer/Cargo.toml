[package]
name        = "elide-extminer"
version.workspace = true
edition     = "2021"
license     = "Apache-2.0"
description = "External Poseidon2b PoW miner for ParanO(1)d"
default-run = "elide-miner"

[[bin]]
name = "elide-miner"
path = "src/main.rs"

[dependencies]
# PoW hashing
elide_core      = { path = "../elide_core" }
elide_poseidon2b = { path = "../elide_poseidon2b" }
rayon      = "1"

# HTTP / JSON-RPC
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Misc
hex    = "0.4"
anyhow = "1"
