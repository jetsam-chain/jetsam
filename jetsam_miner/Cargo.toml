[package]
name = "jetsam_miner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jetsam_chain    = { path = "../jetsam_chain" }
jetsam_core     = { path = "../jetsam_core" }
jetsam_poseidon2b = { path = "../jetsam_poseidon2b" }
jetsam_block    = { path = "../jetsam_block" }
jetsam_gkr      = { path = "../jetsam_gkr" }
jetsam_recursive = { path = "../jetsam_recursive" }
jetsam-ivc-core = { path = "../jetsam_ivc_core" }
jetsam-ivc-prover = { path = "../jetsam_ivc_prover" }
jetsam_tx       = { path = "../jetsam_tx" }
jetsam_mempool  = { path = "../jetsam_mempool" }
hex           = "0.4"
libc          = "0.2"
rayon         = "1"
tokio         = { workspace = true }
tracing       = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
bincode       = "1"
zstd          = { version = "0.13", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3"
