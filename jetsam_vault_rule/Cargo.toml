[package]
name = "jetsam_vault_rule"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "V4, the deposit rule of the v1.7 bridge vault (V4-0, V4-a..V4-e, V4-d), no_std and without dependencies: the one implementation the node's vault gate and the L1's proof program both run (SPEC-v3 G6 = V4)."

[features]
# The private rehearsal clock (F_R = J_R + 32), enabled by `jetsam_chain/rehearsal-v1-7`.
rehearsal-v1-7 = []
# The test chain's profile, enabled by `jetsam_chain/testnet`. Its bridge opens `TESTNET_OPENING_DELAY` = 544
# blocks after its J instead of 1 440 (D104: F = 8 704), and keeps its largest deposit of before D123 (1 000 JTM)
# below `TESTNET_CAPS_HEIGHT` (not chosen: every height); the rest of V4 is the public one's. It also carries the
# node's profile to the proof program of the same build (`TESTNET_PROFILE`), so that a build naming
# `jetsam_chain/testnet` alone has the test chain's program.
testnet = []
# A5-12: the logical txid of a deposit (`txid`, `p2b`), the one implementation the proof program and the
# robot run; it needs the Poseidon2b permutation of the program's no_std, dependency-free `towerwalk`. The
# node does not enable it (its consensus txid is `jetsam_tx`'s, checked equal on the G6 vectors).
txid = ["dep:tw-core"]

[dependencies]
tw-core = { package = "jetsam_bridge_towerwalk", path = "../jetsam_bridge_program/towerwalk", optional = true }
