[package]
name = "jetsam_bridge_program"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Bridge proof program core (no_std): the relations the SP1 guests prove (checkpoint, deposit claim). Imported from the v2 prototype spv-core."

[features]
# The test chain profile (genesis d9d156ee, v1.6 at 4800). Default: the public network (v1.6 at 46080), or
# the test chain when the build holds the node's `jetsam_chain/testnet` (`jetsam_vault_rule::TESTNET_PROFILE`, M5).
# Never enables `jetsam_vault_rule/testnet` itself: the guests' builds (no node in them) stay as they are.
testnet = []
# The private rehearsal: its v1.7 clock (J_R = 96, F_R = 128) and its header clocks (v1.5 at 36, v1.6 at 64,
# no pin), as `jetsam_chain/rehearsal-v1-7`.
rehearsal-v1-7 = ["jetsam_vault_rule/rehearsal-v1-7"]
# TEST ONLY: the clock of the node's G6 = V4 vectors (J = 69 120), to run them through a guest; never
# a deployed program.
test-clock-j69120 = []

[dependencies]
tw-core = { package = "jetsam_bridge_towerwalk", path = "../towerwalk" }
# V4 and the logical txid of a deposit (A5-12): the one implementation the robot runs too
jetsam_vault_rule = { path = "../../jetsam_vault_rule", features = ["txid"] }

[dev-dependencies]
serde_json = { workspace = true }
