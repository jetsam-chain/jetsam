[package]
name = "elide_gkr"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
elide_core = { path = "../elide_core" }
elide_poseidon2b = { path = "../elide_poseidon2b" }
elide_fri = { path = "../elide_fri" }
elide_fri_binius = { path = "../elide_fri_binius" }
elide_tx = { path = "../elide_tx" }
rayon = "1.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
rand = "0.8"
bincode = "1"
hex = "0.4"
static_assertions = "1.1"
