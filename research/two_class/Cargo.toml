[package]
name = "paraelide-two-class-research"
version = "0.0.0"
edition = "2021"
publish = false

# This empty workspace deliberately breaks inheritance from the production
# workspace two directories above. Root `cargo test --workspace` and release
# tooling therefore cannot discover or build this crate.
[workspace]
resolver = "2"

[lib]
path = "src/lib.rs"

[dependencies]
elide_chain = { path = "../../elide_chain" }
elide_core = { path = "../../elide_core" }
elide_fri = { path = "../../elide_fri" }
elide_fri_binius = { path = "../../elide_fri_binius" }
elide_gkr = { path = "../../elide_gkr" }
elide-ivc-core = { path = "../../elide_ivc_core" }
elide_poseidon2b = { path = "../../elide_poseidon2b" }
elide_recursive = { path = "../../elide_recursive" }
elide_tx = { path = "../../elide_tx" }

[[bin]]
name = "two-class-census"
path = "src/bin/census.rs"

[[bin]]
name = "two-class-wallet-bench"
path = "src/bin/wallet_bench.rs"

[profile.release]
debug = true
