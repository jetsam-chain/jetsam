[package]
name = "parajetsam-two-class-research"
version = "0.0.0"
edition = "2021"
publish = false

# This empty workspace deliberately breaks inheritance from the production
# workspace two directories above. Root `cargo test --workspace` and release
# tooling therefore cannot discover or build this crate.
[workspace]
resolver = "2"

[lib]
path = "src/lib.rs"

[dependencies]
jetsam_chain = { path = "../../jetsam_chain" }
jetsam_core = { path = "../../jetsam_core" }
jetsam_fri = { path = "../../jetsam_fri" }
jetsam_fri_binius = { path = "../../jetsam_fri_binius" }
jetsam_gkr = { path = "../../jetsam_gkr" }
jetsam-ivc-core = { path = "../../jetsam_ivc_core" }
jetsam_poseidon2b = { path = "../../jetsam_poseidon2b" }
jetsam_recursive = { path = "../../jetsam_recursive" }
jetsam_tx = { path = "../../jetsam_tx" }

[[bin]]
name = "two-class-census"
path = "src/bin/census.rs"

[[bin]]
name = "two-class-wallet-bench"
path = "src/bin/wallet_bench.rs"

[profile.release]
debug = true
