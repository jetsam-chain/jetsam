[package]
name = "elide_p2p"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
elide_chain    = { path = "../elide_chain" }
elide_tx       = { path = "../elide_tx" }
elide_mempool = { path = "../elide_mempool" }
elide_poseidon2b = { path = "../elide_poseidon2b" }
libp2p       = { version = "0.54", features = [
    "tokio", "tcp", "noise", "yamux", "dns",
    "gossipsub", "request-response", "cbor", "identify",
    "ping", "macros", "kad", "mdns",
    # NAT traversal
    "relay",     # circuit relay v2 (client + server modes)
    "dcutr",     # direct connection upgrade through relay (hole punching)
] }
libp2p-connection-limits = "0.4"
futures  = "0.3"
tokio      = { workspace = true }
tracing    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
async-trait = "0.1"
libc = "0.2"
rand = "0.8"
zstd = "0.13"
blake3 = "1"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
